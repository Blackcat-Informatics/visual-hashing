[package]
name = "visual-hashing"
description = "Human-friendly visual fingerprints for keys and checksums: a nameable 64-emoji BLAKE3 hash (emojihash) and OpenSSH-style drunken-bishop randomart"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
repository = "https://github.com/Blackcat-Informatics/visual-hashing"
homepage = "https://github.com/Blackcat-Informatics/visual-hashing"
documentation = "https://docs.rs/visual-hashing"
readme = "README.md"
keywords = ["fingerprint", "randomart", "blake3", "emoji", "visualization"]
categories = ["cryptography", "visualization"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-MULAN",
    "LICENSES/**",
    "LICENSING.md",
    "src/**",
    "tests/**",
    "vectors/emojihash/*.json",
    "vectors/randomart/*.json",
]

[dev-dependencies]
# Not a dependency of the library: the upstream implementation is kept as an
# oracle so `tests/blake3_equivalence.rs` can prove that `src/blake3.rs` agrees
# with it byte for byte. Dev-dependencies are never built by consumers.
blake3 = "1"
